---
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: false
      - name: PDF text tool
        run: sudo apt-get update --quiet && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Lock file is current
        run: uv lock --check
      - name: Install
        run: uv sync --locked --extra dev
      - name: Check
        run: uv run make check PY=python

  all-green:
    name: all-green
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            [ "${result}" = "success" ] || exit 1
          done
