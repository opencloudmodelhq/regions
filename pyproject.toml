[project]
name = "opencloudmodel-regions"
version = "1.0.0"
description = "Evidence-linked dataset of cloud region locations and codes, rebuilt by script"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.15.7", "rdflib>=7", "prov==3.2.3", "pyshacl==0.40.2", "pyright==1.1.407", "reuse[charset-normalizer]==6.3.0", "cffconvert==2.0.0"]

[project.scripts]
ocm-regions = "ocm_regions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocm_regions"]

[tool.hatch.build.targets.wheel.force-include]
"src/ocm_regions/publish/site_template.html" = "ocm_regions/publish/site_template.html"
"src/ocm_regions/publish/provenance_shapes.ttl" = "ocm_regions/publish/provenance_shapes.ttl"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "UP", "B", "SIM", "C90"]
ignore = ["E501", "UP040"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"typings/**" = ["D"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
enableTypeIgnoreComments = false
deprecateTypingAliases = true
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImplicitStringConcatenation = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
reportUnusedCallResult = "error"
